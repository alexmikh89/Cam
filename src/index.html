<html>

<head>
    <title>ESP32-CAM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 0px auto;
            padding-top: 30px;
        }

        table {
            margin-left: auto;
            margin-right: auto;
        }

        td {
            padding: 8 px;
        }

        .button {
            background-color: #2f4468;
            border: none;
            color: white;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 18px;
            margin: 6px 3px;
            cursor: pointer;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
        }

        img {
            width: auto;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>

<body>
    <h1>ESP32-CAM Pan 2</h1>
    <table>
        <tr>
            <td style="text-align:center"> <img src="" id="photo"> </td>
        </tr>
        <tr>
            <td
                style="color: white; background: rgba(0,0,0,0.5); padding: 3px; border-radius: 5px; margin-top: 10px; width: 100%;  text-align: left;">
                RSSI: <span id="RRSIValue"> 0 </span>
        </tr>
        <tr>
            <td style="text-align:center">
                <button class="button" onmousedown="toggleCheckbox('lefter');"
                    ontouchstart="toggleCheckbox('lefter');">Lefter</button>
                <button class="button" onmousedown="toggleCheckbox('left');"
                    ontouchstart="toggleCheckbox('left');">Left</button>
                <button class="button" onmousedown="toggleCheckbox('middle');"
                    ontouchstart="toggleCheckbox('middle');">Middle</button>
                <button class="button" onmousedown="toggleCheckbox('right');"
                    ontouchstart="toggleCheckbox('right');">Right</button>
                <button class="button" onmousedown="toggleCheckbox('righter');"
                    ontouchstart="toggleCheckbox('righter');">Righter</button>
            </td>
        </tr>
    </table>
    <script>
        function toggleCheckbox(x) {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "/action?go=" + x, true);
            xhr.send();
        }

        setInterval(function () {
            // Call a function repetatively with 2 Second interval
            getData();
        }, 2000); //2000mSeconds update rate

        function getData() {
            var xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function () {
                if (this.readyState == 4 && this.status == 200) {
                    document.getElementById("RRSIValue").innerHTML =
                        this.responseText;
                }
            };
            xhttp.open("GET", "/action?go=readRRSI", true);
            xhttp.send();
        }
        window.onload = document.getElementById("photo").src = window.location.href.slice(0, -1) + ":81/stream";
    </script>
</body>

</html>
